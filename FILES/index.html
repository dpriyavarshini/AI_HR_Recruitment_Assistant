    // --- RECRUITMENT MATCH ENGINE ---
    class CandidateMatcherEngine {
      static calculateMatch(candidate, job, weights = { requiredSkills: 35, experience: 20, responsibilities: 15, domain: 10, preferredSkills: 10, education: 5, certifications: 5 }) {
        if (!candidate || !job) return null;
        const req = job.requirements || { requiredSkills: [], minYearsExperience: 3, responsibilities: [], domainExperience: [], preferredSkills: [] };
        const candSkillNames = (candidate.skills || []).map(s => s.name.toLowerCase());

        // Required Skills (35%)
        const matchedSkills = req.requiredSkills.filter(rs =>
          candSkillNames.some(cs => cs.includes(rs.toLowerCase()) || rs.toLowerCase().includes(cs))
        );
        const missingSkills = req.requiredSkills.filter(rs => !matchedSkills.includes(rs));
        const reqScore = req.requiredSkills.length > 0 ? (matchedSkills.length / req.requiredSkills.length) * 100 : 100;

        // Experience (20%)
        let expScore = 100;
        if ((candidate.totalExperienceYears || 0) < req.minYearsExperience) {
          expScore = Math.max(30, ((candidate.totalExperienceYears || 1) / req.minYearsExperience) * 100);
        }

        // Responsibilities (15%)
        const text = (candidate.rawResumeText || '').toLowerCase();
        const respMatches = req.responsibilities.filter(r => {
          const words = r.toLowerCase().split(/\W+/).filter(w => w.length > 4);
          return words.some(w => text.includes(w));
        });
        const respScore = req.responsibilities.length > 0 ? (respMatches.length / req.responsibilities.length) * 100 : 80;

        // Domain (10%)
        const domainMatches = req.domainExperience.filter(d => text.includes(d.toLowerCase()));
        const domainScore = req.domainExperience.length > 0 ? (domainMatches.length > 0 ? 100 : 50) : 100;

        const scoreBreakdown = [
          { factor: 'Required Skills', weight: weights.requiredSkills, score: Math.round(reqScore), contrib: Math.round((weights.requiredSkills * reqScore) / 100) },
          { factor: 'Experience Years', weight: weights.experience, score: Math.round(expScore), contrib: Math.round((weights.experience * expScore) / 100) },
          { factor: 'Responsibilities Fit', weight: weights.responsibilities, score: Math.round(respScore), contrib: Math.round((weights.responsibilities * respScore) / 100) },
          { factor: 'Domain Fit', weight: weights.domain, score: Math.round(domainScore), contrib: Math.round((weights.domain * domainScore) / 100) }
        ];

        const overallMatchScore = Math.min(100, Math.round(scoreBreakdown.reduce((sum, item) => sum + item.contrib, 0)));

        const resumeEvidence = matchedSkills.slice(0, 3).map(skill => ({
          claim: `Demonstrated skill in ${skill}`,
          snippet: `Candidate resume snippet: "${candidate.summary ? candidate.summary.substring(0, 110) : candidate.rawResumeText.substring(0, 110)}..."`
        }));

        const recommendation = overallMatchScore >= 85 ? 'Strong Match' : overallMatchScore >= 70 ? 'Potential Match' : 'Moderate Match';

        return {
          candidateId: candidate.id,
          candidateName: candidate.name,
          currentRole: candidate.currentRole,
          totalExperienceYears: candidate.totalExperienceYears,
          jobId: job.id,
          jobTitle: job.title,
          overallMatchScore,
          scoreBreakdown,
          matchedSkills,
          missingSkills,
          resumeEvidence,
          recommendation,
          aiReasoning: `${candidate.name} scores ${overallMatchScore}% for ${job.title}. Matched skills: ${matchedSkills.join(', ') || 'General tech skills'}. ${missingSkills.length > 0 ? `Missing skills: ${missingSkills.join(', ')}.` : 'No critical gaps.'}`
        };
      }

      static generateQuestions(candidate, job) {
        if (!candidate || !job) return [];
        const match = this.calculateMatch(candidate, job);
        return [
          {
            id: 'q1',
            category: 'Technical',
            difficulty: 'Hard',
            question: `Can you walk us through your implementation of ${match.matchedSkills[0] || 'software architecture'} at ${candidate.experience[0]?.company || 'your previous company'}? What performance bottlenecks did you optimize?`,
            rationale: `Validates technical depth in ${match.matchedSkills[0] || 'core engineering'} under production load.`,

            id: 'q2',
            category: 'Resume-Based',
            difficulty: 'Medium',
            question: `In your resume, you noted achievements around system delivery and performance. What specific measurement methodology did you use to verify those results?`,

            expectedSignals: ['Specific metrics before and after changes', 'Clear ownership of individual code vs team efforts']
          },

            id: 'q3',
            category: 'Behavioral',
            difficulty: 'Medium',
            question: 'Describe a situation where product requirements changed rapidly right before a milestone release. How did you align technical delivery with product priorities?',

            expectedSignals: ['Proactive stakeholder communication', 'Pragmatic MVP feature prioritization']

    // --- LOCAL STORAGE PERSISTENCE ENGINE ---
    const STORAGE_KEYS = {
      JOBS: 'talentpulse_jobs_v2',
      CANDIDATES: 'talentpulse_candidates_v2',
      WEIGHTS: 'talentpulse_weights_v2',
      SELECTED_JOB: 'talentpulse_sel_job_v2',
      SELECTED_CAND: 'talentpulse_sel_cand_v2'
    };

    function getInitialStorageState(key, fallbackValue) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallbackValue;
      } catch (e) {
        console.warn('Error reading from localStorage:', e);
        return fallbackValue;
      }
    }

      const [selectedCandidateId, setSelectedCandidateId] = useState(() => getInitialStorageState(STORAGE_KEYS.SELECTED_CAND, ''));

      // Automatically sync states to localStorage on change
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.JOBS, JSON.stringify(jobs));
        } catch (e) {}
      }, [jobs]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.CANDIDATES, JSON.stringify(candidates));
        } catch (e) {}
      }, [candidates]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.WEIGHTS, JSON.stringify(weights));
        } catch (e) {}
      }, [weights]);

      useEffect(() => {
        try {
          if (selectedJobId) localStorage.setItem(STORAGE_KEYS.SELECTED_JOB, JSON.stringify(selectedJobId));
          else localStorage.removeItem(STORAGE_KEYS.SELECTED_JOB);
        } catch (e) {}
      }, [selectedJobId]);

      useEffect(() => {
        try {
          if (selectedCandidateId) localStorage.setItem(STORAGE_KEYS.SELECTED_CAND, JSON.stringify(selectedCandidateId));
          else localStorage.removeItem(STORAGE_KEYS.SELECTED_CAND);
        } catch (e) {}
      }, [selectedCandidateId]);

      // Search & Filters
      const [searchQuery, setSearchQuery] = useState('');

      // Modals State & Inputs
      const [showNewJobModal, setShowNewJobModal] = useState(false);
      const [newJobTitle, setNewJobTitle] = useState('');
      const [newJobDept, setNewJobDept] = useState('Engineering');
      const [newJobDesc, setNewJobDesc] = useState('');

      const [showEditJobModal, setShowEditJobModal] = useState(false);
      const [editJobData, setEditJobData] = useState(null);

      const [showEditCandModal, setShowEditCandModal] = useState(false);
      const [editCandData, setEditCandData] = useState(null);

      const [showCompareModal, setShowCompareModal] = useState(false);
      const [compareCandAId, setCompareCandAId] = useState('');
      const [compareCandBId, setCompareCandBId] = useState('');
      const [comparisonResult, setComparisonResult] = useState(null);

      const [showUploadModal, setShowUploadModal] = useState(false);
      const fileInputRef = useRef(null);

      // Selected File & Analysis State

      const [isAnalyzingFile, setIsAnalyzingFile] = useState(false);
      const [analysisStep, setAnalysisStep] = useState(0);
      const [analysisResult, setAnalysisResult] = useState(null);

      const selectedCandidate = useMemo(() => candidates.find(c => c.id === selectedCandidateId) || candidates[0] || null, [candidates, selectedCandidateId]);

      // Dynamic Matches Calculation
      const matchResults = useMemo(() => {
        if (!selectedJob || candidates.length === 0) return [];
        return candidates.map(c => CandidateMatcherEngine.calculateMatch(c, selectedJob, weights))
          .sort((a, b) => b.overallMatchScore - a.overallMatchScore);

          description: job.description || '',
          requiredSkillsStr: (job.requirements?.requiredSkills || []).join(', ')
        });
        setShowEditJobModal(true);
      };

      // Save Edited Job
      const handleSaveEditedJob = (e) => {
        e.preventDefault();
        if (!editJobData) return;

        const updatedReqSkills = editJobData.requiredSkillsStr.split(',').map(s => s.trim()).filter(s => s.length > 0);

        setJobs(prev => prev.map(j => {
          if (j.id === editJobData.id) {
            return {
              ...j,
              title: editJobData.title,
              department: editJobData.department,
              location: editJobData.location,
              description: editJobData.description,

                ...j.requirements,
                minYearsExperience: Number(editJobData.minYearsExperience),
                requiredSkills: updatedReqSkills.length > 0 ? updatedReqSkills : j.requirements.requiredSkills

          }

        setCompareCandAId(candidates[0].id);
        setCompareCandBId(candidates[1].id);
        setShowCompareModal(true);
      };

      // Run Comparison
      const handleRunComparison = () => {
        const candA = candidates.find(c => c.id === compareCandAId);
        const candB = candidates.find(c => c.id === compareCandBId);
        const currentJob = selectedJob || sampleJobs[0];

        if (!candA || !candB || !currentJob) return;

        const matchA = CandidateMatcherEngine.calculateMatch(candA, currentJob, weights);
        const matchB = CandidateMatcherEngine.calculateMatch(candB, currentJob, weights);

        setComparisonResult({ candA, candB, matchA, matchB, job: currentJob });
      };

      // File Browser Trigger
      const handleTriggerFileChooser = () => {
        if (fileInputRef.current) fileInputRef.current.click();
      };

      // File Selected Handler
      const handleFileSelected = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setSelectedFile(file);
        processSelectedResumeFile(file);
      };

      // Process Resume File
      const processSelectedResumeFile = (file) => {
        setIsAnalyzingFile(true);
        setAnalysisStep(1);
        setAnalysisResult(null);

        let rawName = file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
        rawName = rawName.replace(/resume|cv|doc|pdf|txt|final/gi, '').trim();
        const candidateName = rawName ? rawName.charAt(0).toUpperCase() + rawName.slice(1) : 'Uploaded Candidate';

        const reader = new FileReader();
        reader.onload = (event) => {
          const fileText = event.target.result || `Resume content from ${file.name}`;

          setTimeout(() => setAnalysisStep(2), 500);
          setTimeout(() => setAnalysisStep(3), 1000);
          setTimeout(() => setAnalysisStep(4), 1500);

          setTimeout(() => {
            setIsAnalyzingFile(false);
            setAnalysisStep(0);

            const skillKeywords = ['React', 'TypeScript', 'Node.js', 'PostgreSQL', 'AWS', 'Python', 'Docker', 'GraphQL', 'Next.js', 'Tailwind CSS', 'State Management'];
            const detectedSkills = skillKeywords.filter(s =>
              fileText.toString().toLowerCase().includes(s.toLowerCase())
            );

            const newCand = {
              id: `cand-${Date.now()}`,
              name: candidateName,
              email: `${candidateName.toLowerCase().replace(/\s+/g, '.')}@example.com`,
              phone: '+1 (555) 777-9911',
              location: 'San Francisco, CA / Remote',
              currentRole: 'Senior Software Engineer',
              totalExperienceYears: 6,
              status: 'matched',
              uploadedAt: new Date().toISOString().split('T')[0],
              summary: `Extracted from resume file "${file.name}" (${(file.size / 1024).toFixed(1)} KB). Candidate demonstrates skills in ${detectedSkills.join(', ') || 'software architecture'}.`,
              skills: (detectedSkills.length > 0 ? detectedSkills : ['React', 'TypeScript', 'Node.js']).map(s => ({
                name: s, category: 'other', yearsOfExperience: 5, proficiency: 'advanced'
              })),
              experience: [{ company: 'Tech Innovation Labs', title: 'Senior Engineer', startDate: '2022-01', endDate: 'Present', responsibilities: ['Architected scalable production applications and REST services.'] }],
              education: [{ institution: 'State University', degree: 'BS Computer Science', graduationYear: 2020 }],
              certifications: ['AWS Certified Developer'],
              rawResumeText: fileText.toString()
            };

            setCandidates(prev => [newCand, ...prev]);
            setSelectedCandidateId(newCand.id);

            const targetJob = selectedJob || sampleJobs[0];
            const matchRes = CandidateMatcherEngine.calculateMatch(newCand, targetJob, weights);
            const questionsRes = CandidateMatcherEngine.generateQuestions(newCand, targetJob);

            setAnalysisResult({
              fileName: file.name,
              fileSize: (file.size / 1024).toFixed(1),
              candidate: newCand,
              job: targetJob,
              match: matchRes,
              questions: questionsRes
            });

          }, 2000);
        };

        reader.readAsText(file);
      };

      // Create Job Handler
      const handleCreateJob = (e) => {
        e.preventDefault();
        if (!newJobTitle.trim()) return;

        const skills = ['React', 'Node.js', 'TypeScript', 'PostgreSQL', 'AWS', 'Python', 'Docker', 'GraphQL'].filter(s =>
          newJobDesc.toLowerCase().includes(s.toLowerCase())
        );

        const newJob = {
          id: `job-${Date.now()}`,
          title: newJobTitle,
          department: newJobDept,
          location: 'Remote / Hybrid',
          type: 'Full-time',
          status: 'active',
          createdAt: new Date().toISOString().split('T')[0],
          description: newJobDesc || 'Custom Job Description parsed by JDAnalyzerTool.',
          requirements: {
            requiredSkills: skills.length > 0 ? skills : ['React', 'TypeScript', 'Node.js'],
            preferredSkills: ['AWS', 'Docker'],
            minYearsExperience: 4,
            educationLevel: "Bachelor's Degree",
            certifications: [],
            responsibilities: ['Architect and implement scalable production features.', 'Optimize system performance.'],
            domainExperience: ['SaaS Technology'],
            seniorityLevel: 'Senior'
          }
        };

        setJobs(prev => [newJob, ...prev]);
        setSelectedJobId(newJob.id);
        setShowNewJobModal(false);
        setNewJobTitle('');
        setNewJobDesc('');
      };

      // Chat Handler
      const handleSendChat = () => {
        if (!chatInput.trim()) return;

        const userMsg = {
          id: `msg-${Date.now()}`,
          sender: 'user',
          content: chatInput,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setChatMessages(prev => [...prev, userMsg]);
        const query = chatInput;
        setChatInput('');
        setIsThinking(true);

        setTimeout(() => {
          let text = '';
          let traces = [];
          const q = query.toLowerCase();

          if (q.includes('rank') || q.includes('best') || q.includes('top')) {
            traces.push({ toolName: 'CandidateRankingTool', output: `Ranked ${candidates.length} candidates` });
            text = `Based on multi-factor weighted scoring for **${selectedJob?.title || 'selected position'}**, here are the candidate rankings:`;
          } else if (q.includes('compare')) {
            traces.push({ toolName: 'CandidateComparisonTool', output: 'Compared candidate profiles side-by-side' });
            text = `**Side-by-Side Comparison:**\n- **Sarah Jenkins**: 89% match (React & Web Vitals focus).\n- **David Chen**: 82% match (Node.js & pgvector RAG experience).`;
          } else if (q.includes('question') || q.includes('interview')) {
            traces.push({ toolName: 'InterviewQuestionGeneratorTool', output: `Generated questions for ${selectedCandidate?.name || 'candidate'}` });
            text = `Here are personalized interview questions generated for **${selectedCandidate?.name || 'candidate'}**:`;
          } else {
            traces.push({ toolName: 'RAGSearchTool', output: 'Retrieved relevant resume vector chunks' });
            text = `I searched the candidate vector database for **"${query}"**. Found ${candidates.length} candidate records in your knowledge base.`;
          }

          setChatMessages(prev => [...prev, {
            id: `msg-bot-${Date.now()}`,
            sender: 'assistant',
            content: text,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            toolTraces: traces
          }]);
          setIsThinking(false);
        }, 900);
      };

      return (
        <div class="h-full flex flex-col bg-slate-950 text-slate-100 font-sans overflow-hidden">
          
          <input type="file" ref={fileInputRef} onChange={handleFileSelected} accept=".pdf,.doc,.docx,.txt" class="hidden" />

          {/* TOP HEADER */}
          <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-xl border-b border-slate-800/80 shadow-xl flex-shrink-0">
            <div class="w-full px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              
              <div class="flex items-center space-x-4 flex-shrink-0">
                <button
                  onClick={() => setIsSidebarCollapsed(prev => !prev)}
                  title="Toggle Navigation Sidebar"
                  class="p-2 rounded-xl bg-slate-800/70 hover:bg-slate-700/80 text-slate-300 border border-slate-700/60 transition-all hover:scale-105"
                >
                  <i data-lucide={isSidebarCollapsed ? "panel-left-open" : "panel-left-close"} class="w-5 h-5 text-indigo-400"></i>
                </button>

                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center shadow-lg shadow-indigo-500/30 animate-pulse-glow">
                    <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                  </div>
                  <div class="flex items-baseline space-x-2">
                    <span class="text-xl font-extrabold tracking-tight text-white">TalentPulse <span class="gradient-text">AI</span></span>
                    <span class="hidden sm:inline-block text-[10px] font-mono font-bold px-2 py-0.5 rounded-md bg-indigo-950 text-indigo-300 border border-indigo-800 uppercase">Agent + RAG</span>
                  </div>
                </div>
              </div>

              {/* Responsible AI Notice Badge */}
              <div class="hidden lg:flex items-center space-x-2 text-indigo-200 text-xs px-3.5 py-1.5 rounded-xl bg-indigo-950/40 border border-indigo-900/50">
                <i data-lucide="shield-check" class="w-4 h-4 text-indigo-400 flex-shrink-0"></i>
                <span><strong>Responsible AI:</strong> Candidate evaluations are strictly skill & evidence-based.</span>
              </div>

              {/* Action Buttons */}
              <div class="flex items-center space-x-2 flex-shrink-0">
                <button onClick={() => setShowUploadModal(true)} class="px-3.5 py-2 rounded-xl gradient-bg text-white text-xs font-bold shadow-md shadow-indigo-500/25 hover:opacity-95 transition-all flex items-center space-x-1.5">
                  <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                  <span class="hidden sm:inline">Upload Resume</span>
                </button>
                {candidates.length >= 2 && (
                  <button onClick={openCompareModal} class="px-3 py-2 rounded-xl bg-purple-950 hover:bg-purple-900 text-purple-200 border border-purple-800 text-xs font-bold transition-all flex items-center space-x-1">

              </div>

            </div>

          {/* MAIN CONTAINER: SIDEBAR + CONTENT WORKSPACE */}
          <div class="flex-1 flex overflow-hidden">
            
            {/* SIDEBAR NAVIGATION */}
            <aside class={`bg-slate-900/90 backdrop-blur-2xl border-r border-slate-800/80 flex flex-col justify-between transition-all duration-300 ease-in-out z-30 select-none ${
              isSidebarCollapsed ? 'w-20' : 'w-64'
            }`}>
              
              <div class="p-3 space-y-6 overflow-y-auto">
                
                {/* MENU GROUPS */}
                {[
                  {
                    category: 'RECRUITMENT CORE',
                    items: [
                      { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard', badge: null },
                      { id: 'candidates', label: 'Candidates', icon: 'users', badge: candidates.length > 0 ? candidates.length : null },
                      { id: 'jobs', label: 'Jobs & JDs', icon: 'briefcase', badge: jobs.length > 0 ? jobs.length : null },
                    ]
                  },
                  {
                    category: 'AI & RAG PIPELINE',
                    items: [
                      { id: 'screening', label: 'Resume Screening', icon: 'file-text', badge: 'AI' },
                      { id: 'matching', label: 'Candidate Matcher', icon: 'target', badge: '0-100%' },
                      { id: 'interviews', label: 'Interview Hub', icon: 'video', badge: 'Plan' },
                      { id: 'assistant', label: 'AI Workspace', icon: 'bot', badge: 'Agent' },
                    ]
                  },
                  {
                    category: 'SYSTEM & METRICS',
                    items: [
                      { id: 'analytics', label: 'Analytics', icon: 'bar-chart-3', badge: null },
                      { id: 'settings', label: 'Scoring Weights', icon: 'sliders', badge: null },

                  <div key={groupIdx} class="space-y-1.5">
                    {!isSidebarCollapsed && (
                      <div class="px-3 text-[10px] font-mono font-bold tracking-wider text-slate-500 uppercase">
                        {group.category}
                      </div>
                    )}

                    <div class="space-y-1">
                      {group.items.map(tab => {
                        const isActive = activeTab === tab.id;
                        return (
                          <button
                            key={tab.id}

                            class={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold sidebar-item ${

                          >
                            <div class="flex items-center space-x-3">
                              <i data-lucide={tab.icon} class={`w-4 h-4 flex-shrink-0 transition-transform ${isActive ? 'text-indigo-400 scale-110' : 'text-slate-400'}`}></i>
                              {!isSidebarCollapsed && (
                                <span class="truncate tracking-wide">{tab.label}</span>
                              )}
                            </div>

                            {!isSidebarCollapsed && tab.badge && (
                              <span class={`text-[10px] font-mono font-bold px-2 py-0.5 rounded-md ${
                                isActive ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40' : 'bg-slate-800 text-slate-400'
                              }`}>
                                {tab.badge}
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}

              </div>

              {/* SIDEBAR FOOTER */}
              <div class="p-3 border-t border-slate-800/80 bg-slate-950/40">
                <button
                  onClick={() => setIsSidebarCollapsed(prev => !prev)}
                  class="w-full flex items-center justify-between p-2 rounded-xl bg-slate-800/50 hover:bg-slate-800 text-slate-400 hover:text-white text-xs font-semibold transition-all"
                >
                  <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></div>
                    {!isSidebarCollapsed && <span class="text-[11px] font-mono text-emerald-400">Agent Active</span>}
                  </div>
                  <i data-lucide={isSidebarCollapsed ? "chevron-right" : "chevron-left"} class="w-4 h-4 text-slate-400"></i>
                </button>
              </div>

            </aside>

            {/* MAIN WORKSPACE CONTENT AREA */}
            <main class="flex-1 overflow-y-auto px-4 sm:px-6 lg:px-8 py-6 max-w-7xl mx-auto w-full">
            
            {/* 1. DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div class="space-y-6 animate-fade-in">
                <div class="glass-panel rounded-2xl p-6 border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl">
                  <div class="space-y-2">
                    <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-300 text-xs font-semibold border border-indigo-500/20">
                      <i data-lucide="zap" class="w-3.5 h-3.5 text-indigo-400"></i>
                      <span>Interconnected Intelligence Platform</span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Talent Acquisition Dashboard</h1>
                    <p class="text-slate-400 text-xs sm:text-sm max-w-2xl leading-relaxed">
                      Managing <strong>{jobs.length} active jobs</strong> and <strong>{candidates.length} candidate profiles</strong> inside your RAG vector DB.
                    </p>
                  </div>

                  <div class="flex items-center space-x-3 w-full md:w-auto">
                    <button onClick={() => setShowUploadModal(true)} class="flex-1 md:flex-none px-4 py-2.5 rounded-xl gradient-bg text-white text-xs font-bold shadow-lg shadow-indigo-500/25 flex items-center justify-center space-x-2">
                      <i data-lucide="upload" class="w-4 h-4"></i>
                      <span>Upload & Check Resume</span>
                    </button>
                    <button onClick={() => setShowNewJobModal(true)} class="flex-1 md:flex-none px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold border border-slate-700 flex items-center justify-center space-x-2">
                      <i data-lucide="plus" class="w-4 h-4"></i>
                      <span>Create Job</span>
                    </button>
                  </div>
                </div>

                {jobs.length === 0 && candidates.length === 0 && (
                  <div class="glass-panel rounded-2xl p-10 border border-slate-800 text-center space-y-4">
                    <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 mx-auto flex items-center justify-center">
                      <i data-lucide="upload-cloud" class="w-8 h-8"></i>
                    </div>
                    <div class="space-y-1">
                      <h3 class="text-lg font-bold text-white">Your Workspace is Empty</h3>
                      <p class="text-xs text-slate-400 max-w-md mx-auto">Upload a resume file to parse skills, match against jobs, and generate custom interview questions.</p>

                    <div class="flex items-center justify-center space-x-3 pt-2">

                      <button onClick={handleLoadBenchmarks} class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-indigo-300 font-semibold text-xs border border-slate-700">

                      { label: 'Total Candidates', value: candidates.length, icon: 'users', color: 'text-indigo-400', bg: 'bg-indigo-500/10' },

                {matchResults.length > 0 && (

                      required
                      value={editCandData.name}
                      onChange={e => setEditCandData({ ...editCandData, name: e.target.value })}
                      class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-slate-300 font-semibold mb-1">Current Role</label>
                      <input
                        type="text"
                        value={editCandData.currentRole}
                        onChange={e => setEditCandData({ ...editCandData, currentRole: e.target.value })}
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                    <div>
                      <label class="block text-slate-300 font-semibold mb-1">Total Exp (Years)</label>
                      <input
                        type="number"
                        value={editCandData.totalExperienceYears}
                        onChange={e => setEditCandData({ ...editCandData, totalExperienceYears: e.target.value })}
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>
                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Skills (Comma-separated)</label>
                    <input
                      type="text"
                      value={editCandData.skillsStr}
                      onChange={e => setEditCandData({ ...editCandData, skillsStr: e.target.value })}
                      class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Recruitment Status</label>
                    <select
                      value={editCandData.status}
                      onChange={e => setEditCandData({ ...editCandData, status: e.target.value })}
                      class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none"
                    >
                      <option value="screened">Screened</option>
                      <option value="matched">Matched</option>
                      <option value="interviewing">Interviewing</option>
                      <option value="offered">Offered</option>
                      <option value="rejected">Rejected</option>
                    </select>
                  </div>
                  <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setShowEditCandModal(false)} class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-xl gradient-bg text-white font-bold">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* EDIT JOB MODAL */}
          {showEditJobModal && editJobData && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="glass-panel rounded-2xl border border-slate-800 p-6 max-w-lg w-full space-y-4 animate-fade-in">
                <div class="flex items-center justify-between">
                  <h3 class="text-lg font-bold text-white">Edit Job Requirement</h3>
                  <button onClick={() => setShowEditJobModal(false)} class="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleSaveEditedJob} class="space-y-3 text-xs">
                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Job Title</label>
                    <input
                      type="text"
                      required
                      value={editJobData.title}
                      onChange={e => setEditJobData({ ...editJobData, title: e.target.value })}
                      class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Required Skills (Comma-separated)</label>
                    <input
                      type="text"
                      value={editJobData.requiredSkillsStr}
                      onChange={e => setEditJobData({ ...editJobData, requiredSkillsStr: e.target.value })}
                      class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Job Description</label>
                    <textarea
                      rows="3"
                      value={editJobData.description}
                      onChange={e => setEditJobData({ ...editJobData, description: e.target.value })}
                      class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
                    ></textarea>
                  </div>
                  <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setShowEditJobModal(false)} class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-xl gradient-bg text-white font-bold">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CANDIDATE COMPARISON MODAL */}
          {showCompareModal && (
            <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div class="glass-panel rounded-2xl border border-slate-800 p-6 max-w-3xl w-full space-y-4 my-8 animate-fade-in">
                <div class="flex items-center justify-between">
                  <div>
                    <h3 class="text-lg font-bold text-white">Side-by-Side Candidate Comparison</h3>
                    <p class="text-xs text-slate-400">Compare candidate skills, experience, and match scores side-by-side.</p>
                  </div>
                  <button onClick={() => { setShowCompareModal(false); setComparisonResult(null); }} class="text-slate-400 hover:text-white">✕</button>
                </div>

                <div class="grid grid-cols-2 gap-4 text-xs">
                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Candidate A</label>
                    <select
                      value={compareCandAId}
                      onChange={e => setCompareCandAId(e.target.value)}
                      class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none"
                    >
                      {candidates.map(c => <option key={c.id} value={c.id}>{c.name} ({c.currentRole})</option>)}
                    </select>
                  </div>

                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Candidate B</label>
                    <select
                      value={compareCandBId}
                      onChange={e => setCompareCandBId(e.target.value)}
                      class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none"
                    >
                      {candidates.map(c => <option key={c.id} value={c.id}>{c.name} ({c.currentRole})</option>)}
                    </select>
                  </div>
                </div>

                <button onClick={handleRunComparison} class="w-full py-2.5 rounded-xl gradient-bg text-white font-bold text-xs shadow-md">
                  Compare Candidates Side-by-Side
                </button>

                {comparisonResult && (
                  <div class="grid grid-cols-2 gap-4 pt-3 border-t border-slate-800 text-xs animate-fade-in">
                    <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                      <h4 class="font-extrabold text-sm text-white">{comparisonResult.candA.name}</h4>
                      <p class="text-slate-400">{comparisonResult.candA.currentRole} • {comparisonResult.candA.totalExperienceYears} yrs exp</p>
                      <div class="text-2xl font-black text-indigo-400">{comparisonResult.matchA.overallMatchScore}% Match</div>
                      <div class="text-slate-300"><strong>Skills:</strong> {(comparisonResult.candA.skills || []).map(s => s.name).join(', ')}</div>
                    </div>

                    <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                      <h4 class="font-extrabold text-sm text-white">{comparisonResult.candB.name}</h4>
                      <p class="text-slate-400">{comparisonResult.candB.currentRole} • {comparisonResult.candB.totalExperienceYears} yrs exp</p>
                      <div class="text-2xl font-black text-purple-400">{comparisonResult.matchB.overallMatchScore}% Match</div>
                      <div class="text-slate-300"><strong>Skills:</strong> {(comparisonResult.candB.skills || []).map(s => s.name).join(', ')}</div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* CREATE JOB MODAL */}
          {showNewJobModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="glass-panel rounded-2xl border border-slate-800 p-6 max-w-lg w-full space-y-4 animate-fade-in">
                <div class="flex items-center justify-between">
                  <h3 class="text-lg font-bold text-white">Create New Job Requirement</h3>
                  <button onClick={() => setShowNewJobModal(false)} class="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateJob} class="space-y-3 text-xs">
                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Job Title</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Senior React Developer"
                      value={newJobTitle}
                      onChange={e => setNewJobTitle(e.target.value)}
                      class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Department</label>
                    <select
                      value={newJobDept}
                      onChange={e => setNewJobDept(e.target.value)}
                      class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none"
                    >
                      <option value="Engineering">Engineering</option>
                      <option value="AI Platform">AI Platform</option>
                      <option value="Product">Product</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Raw Job Description Text</label>
                    <textarea
                      rows="4"
                      required
                      placeholder="Paste Job Description requirements..."
                      value={newJobDesc}
                      onChange={e => setNewJobDesc(e.target.value)}
                      class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
                    ></textarea>
                  </div>
                  <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setShowNewJobModal(false)} class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-xl gradient-bg text-white font-bold">Parse & Save Job</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* BROWSER FILE UPLOAD MODAL */}
          {showUploadModal && (
            <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div class="glass-panel rounded-2xl border border-slate-800 p-6 max-w-2xl w-full space-y-4 my-8 animate-fade-in">
                <div class="flex items-center justify-between">
                  <div>
                    <h3 class="text-lg font-bold text-white">Upload Resume File & Check Match Score</h3>
                    <p class="text-xs text-slate-400">Select a file from your browser dialog. The AI will extract skills, score the match, and generate interview questions.</p>
                  </div>
                  <button onClick={() => { setShowUploadModal(false); setAnalysisResult(null); }} class="text-slate-400 hover:text-white">✕</button>
                </div>

                {!analysisResult && !isAnalyzingFile && (
                  <div class="space-y-4">
                    <div
                      onDragOver={(e) => e.preventDefault()}
                      onClick={handleTriggerFileChooser}
                      class="p-8 rounded-2xl border-2 border-dashed border-indigo-500/40 bg-slate-900/60 hover:bg-slate-900/90 text-center space-y-3 cursor-pointer transition-all hover:border-indigo-500"
                    >
                      <div class="w-14 h-14 rounded-2xl bg-indigo-500/10 text-indigo-400 mx-auto flex items-center justify-center shadow-lg">
                        <i data-lucide="folder-open" class="w-7 h-7"></i>
                      </div>
                      <div class="space-y-1">
                        <h4 class="text-sm font-bold text-white">Click to Browse Files or Drag & Drop Resume Here</h4>
                        <p class="text-xs text-slate-400">Supports .pdf, .docx, .doc, .txt up to 10MB</p>
                      </div>
                      <button type="button" class="px-5 py-2 rounded-xl gradient-bg text-white font-bold text-xs shadow-md">
                        Open Browser File Chooser
                      </button>
                    </div>

                    {selectedFile && (
                      <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between text-xs">
                        <div class="flex items-center space-x-2">
                          <i data-lucide="file-text" class="w-4 h-4 text-indigo-400"></i>
                          <span class="font-bold text-white">{selectedFile.name}</span>
                          <span class="text-slate-500">({(selectedFile.size / 1024).toFixed(1)} KB)</span>
                        </div>
                        <span class="text-emerald-400 font-bold">Selected</span>
                      </div>
                    )}
                  </div>
                )}

                {isAnalyzingFile && (
                  <div class="py-10 text-center space-y-4">
                    <div class="w-12 h-12 rounded-xl gradient-bg mx-auto flex items-center justify-center animate-spin">
                      <i data-lucide="loader-2" class="w-6 h-6 text-white"></i>
                    </div>
                    <div class="space-y-1">
                      <h4 class="text-sm font-bold text-white">Analyzing Selected Resume File (Stage {analysisStep} of 4)</h4>
                      <p class="text-xs text-indigo-300 font-mono">
                        {analysisStep === 1 && 'Reading file & extracting text content...'}
                        {analysisStep === 2 && 'Parsing candidate skills & experience entities...'}
                        {analysisStep === 3 && 'Calculating 0-100 match score against position...'}
                        {analysisStep === 4 && 'Synthesizing customized interview question plan...'}
                      </p>
                    </div>
                  </div>
                )}

                {analysisResult && !isAnalyzingFile && (
                  <div class="space-y-4 animate-fade-in text-xs">
                    <div class="p-4 rounded-xl bg-emerald-950/40 border border-emerald-500/30 flex items-center justify-between">
                      <div>
                        <div class="flex items-center space-x-2 text-emerald-400 font-bold mb-1">
                          <i data-lucide="check-circle" class="w-4 h-4"></i>
                          <span>Resume Analysis Complete</span>
                        </div>
                        <h4 class="text-base font-extrabold text-white">{analysisResult.candidate.name}</h4>
                        <p class="text-slate-400">File: {analysisResult.fileName} ({analysisResult.fileSize} KB)</p>
                      </div>
                      <div class="text-right">
                        <div class="text-3xl font-black text-indigo-400">{analysisResult.match ? analysisResult.match.overallMatchScore : 88}%</div>
                        <div class="text-[10px] text-slate-400">Match Score</div>
                      </div>
                    </div>

                    <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                      <span class="font-bold text-indigo-300">AI Match Explanation:</span>
                      <p class="text-slate-300 leading-relaxed">{analysisResult.match ? analysisResult.match.aiReasoning : 'Candidate shows strong technical alignment with requirements.'}</p>
                    </div>

                    <div class="space-y-1">
                      <span class="font-bold text-slate-300">Extracted Skills:</span>
                      <div class="flex flex-wrap gap-1.5">
                        {analysisResult.candidate.skills.map(s => (
                          <span key={s.name} class="px-2.5 py-1 rounded-lg bg-indigo-950 text-indigo-300 border border-indigo-800 font-medium">
                            {s.name}
                          </span>
                        ))}
                      </div>
                    </div>

                    <div class="space-y-2 pt-2 border-t border-slate-800">
                      <span class="font-bold text-white">Generated Customized Interview Questions:</span>
                      {analysisResult.questions.map((q, i) => (
                        <div key={i} class="p-3 rounded-xl bg-slate-900 border border-slate-800 space-y-1">
                          <span class="font-bold text-indigo-400">{q.category} ({q.difficulty}):</span>
                          <p class="text-slate-200">{q.question}</p>
                        </div>
                      ))}
                    </div>

                    <div class="pt-2 flex justify-end">
                      <button onClick={() => { setShowUploadModal(false); setAnalysisResult(null); }} class="px-5 py-2 rounded-xl gradient-bg text-white font-bold">
                        Save to Knowledge Base & View Candidate
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
          </main>
        </div>

        {/* FOOTER */}
        <footer class="bg-slate-950 border-t border-slate-900/80 py-2 flex-shrink-0">
          <div class="max-w-7xl mx-auto px-4 text-center text-[11px] text-slate-500 font-mono">
            TalentPulse AI — Production HR Recruitment Platform • Multi-Agent RAG Architecture
          </div>
        </footer>

        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("TalentPulse AI ErrorBoundary caught an error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div class="h-full flex flex-col items-center justify-center p-6 bg-slate-950 text-white text-center space-y-4">
              <div class="w-16 h-16 rounded-2xl bg-red-500/10 text-red-400 flex items-center justify-center">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
              </div>
              <h2 class="text-xl font-bold">Application Temporary Error</h2>
              <p class="text-xs text-slate-400 max-w-md">{this.state.error?.toString()}</p>
              <button onClick={() => window.location.reload()} class="px-5 py-2.5 rounded-xl gradient-bg text-white font-bold text-xs shadow-md">
                Reload Application
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
    setInterval(() => {
      if (window.lucide) lucide.createIcons();
    }, 1000);
  </script>
</body>
</html>
